name: Nix
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: Check formatting
        run: nix fmt -- --ci

  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        run: |
          docs_only=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | ./scripts/ci-docs-only-paths)
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  flake-check:
    needs: changes
    # A skipped or failed classifier must not silently skip real Nix
    # validation, so this condition (not the implicit needs-succeeded
    # default) decides whether the job runs: any event other than
    # pull_request, or a classifier that did not complete successfully,
    # always runs; only a definitive docs_only:true skips.
    if: "!cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true')"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Make room for NixOS closures
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: Enable KVM for the Nix builder
        run: sudo chmod 666 /dev/kvm
      - name: Evaluate and test
        run: nix flake check --print-build-logs

  build:
    needs: changes
    if: "!cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true')"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - ThinkPad-X1-Carbon-Gen-11
          - ThinkPad-X1-Carbon-Gen-11-bootstrap
          - MS-7D91
          - MS-7D91-bootstrap
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Make room for NixOS closures
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            system-features = big-parallel benchmark
      - name: Build host configuration without secrets
        run: |
          nix build --no-link \
            .#nixosConfigurations.${{ matrix.target }}.config.system.build.toplevel
