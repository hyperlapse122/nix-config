name: Update agent plugins
# Bumps the pinned agent-plugin release. The existing update-flake-lock workflow
# cannot do this: it re-resolves the lock for the ref each input names, so a
# tag-pinned input never moves off its tag. Moving the pin means rewriting the
# tag itself, and the recorded expected revision with it.
on:
  schedule:
    - cron: '0 6 * * 2' # Every Tuesday at 06:00 UTC, a day after the lock refresh
  workflow_dispatch:
concurrency:
  group: update-agent-plugins
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
jobs:
  update-agent-plugins:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLUGIN_SOURCE: EveryInc/compound-engineering-plugin
      TAG_PREFIX: compound-engineering-
      BRANCH: update-agent-plugins
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24

      - name: Resolve the newest release on the plugin's tag train
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_UPDATES || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The helper owns prefix filtering and numeric comparison, and refuses
          # any tag that is not the prefix plus plain numeric components. This
          # job never re-implements that: the resolved value is interpolated
          # into a rewrite step in a job that can push branches.
          resolved=$(nix run .#agent-plugin-release -- \
            --source "$PLUGIN_SOURCE" --tag-prefix "$TAG_PREFIX")
          current=$(sed -n 's#.*url = "github:EveryInc/compound-engineering-plugin/\(.*\)";#\1#p' flake.nix)
          if [ -z "$current" ]; then
            echo "could not read the current pin from flake.nix" >&2
            exit 1
          fi
          printf 'resolved=%s\n' "$resolved" >> "$GITHUB_OUTPUT"
          printf 'current=%s\n' "$current" >> "$GITHUB_OUTPUT"
          if [ "$resolved" = "$current" ]; then
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
            echo "pin is current at $current"
          else
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
            echo "pin $current is behind $resolved"
          fi

      - name: Rewrite the pin and relock
        if: steps.resolve.outputs.changed == 'true'
        env:
          RESOLVED: ${{ steps.resolve.outputs.resolved }}
          CURRENT: ${{ steps.resolve.outputs.current }}
        run: |
          set -euo pipefail
          # Re-check the shape here too: the value crossed a step boundary, and
          # this step rewrites tracked files.
          case "$RESOLVED" in
            "$TAG_PREFIX"v[0-9]*) ;;
            *) echo "refusing an unexpected resolved tag" >&2; exit 1 ;;
          esac
          sed -i "s#compound-engineering-plugin/$CURRENT#compound-engineering-plugin/$RESOLVED#" flake.nix
          sed -i "s#tag = \"$CURRENT\";#tag = \"$RESOLVED\";#" home/h82/agent-plugins.nix
          nix flake lock --update-input compound-engineering-plugin
          # The registry's expected revision has to move with the tag, or the
          # agent-plugins check would sit permanently red instead of signalling.
          rev=$(jq -r '.nodes["compound-engineering-plugin"].locked.rev' flake.lock)
          case "$rev" in
            [0-9a-f][0-9a-f]*) ;;
            *) echo "flake.lock recorded no usable revision" >&2; exit 1 ;;
          esac
          sed -i "s#expectedRev = \"[0-9a-f]*\";#expectedRev = \"$rev\";#" home/h82/agent-plugins.nix
          printf 'rev=%s\n' "$rev" >> "$GITHUB_ENV"

      - name: Verify the bump before proposing it
        if: steps.resolve.outputs.changed == 'true'
        run: |
          set -euo pipefail
          nix fmt -- --ci
          nix build --no-link .#checks.x86_64-linux.agent-plugins

      - name: Open a pull request
        if: steps.resolve.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_UPDATES || secrets.GITHUB_TOKEN }}
          RESOLVED: ${{ steps.resolve.outputs.resolved }}
          CURRENT: ${{ steps.resolve.outputs.current }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add flake.nix flake.lock home/h82/agent-plugins.nix
          git commit -m "chore(agents): bump compound-engineering to $RESOLVED"
          git push --force-with-lease origin "$BRANCH"

          # A version string is not a reviewable change on its own: the diff is
          # three lines while the actual change is the plugin's executable
          # skills, which run in every project on this machine. The body carries
          # what a reviewer needs to judge that.
          compare="https://github.com/$PLUGIN_SOURCE/compare/$CURRENT...$RESOLVED"
          {
            printf 'Bumps the pinned agent plugin from `%s` to `%s`.\n\n' "$CURRENT" "$RESOLVED"
            printf 'Locked revision: `%s`\n\n' "$rev"
            printf 'Upstream compare: %s\n\n' "$compare"
            printf 'Changed paths under `skills/`:\n\n```\n'
            gh api "repos/$PLUGIN_SOURCE/compare/$CURRENT...$RESOLVED" \
              --jq '.files[].filename' 2>/dev/null | grep '^skills/' || echo '(none reported)'
            printf '```\n'
          } > pr-body.md

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --title "chore(agents): bump compound-engineering to $RESOLVED" \
              --body-file pr-body.md
          else
            gh pr create --head "$BRANCH" \
              --title "chore(agents): bump compound-engineering to $RESOLVED" \
              --body-file pr-body.md \
              --label dependencies --label automated
          fi
