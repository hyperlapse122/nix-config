name: Update dependencies

on:
  schedule:
    - cron: '7,37 * * * *' # Every 30 minutes, off the hour
  workflow_dispatch:

concurrency:
  group: update-dependencies
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_UPDATES || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES || secrets.GITHUB_TOKEN }}

      - name: Make room for NixOS closures
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      - name: Enable KVM for the Nix builder
        run: sudo chmod 666 /dev/kvm || true

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      - name: Update flake inputs, agent plugins, and packages
        id: update
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # 1. Update flake inputs
          nix flake update

          # 2. Update agent plugins
          PLUGIN_SOURCE="EveryInc/compound-engineering-plugin"
          TAG_PREFIX="compound-engineering-"
          resolved=$(nix run .#agent-plugin-release -- --source "$PLUGIN_SOURCE" --tag-prefix "$TAG_PREFIX")
          current=$(sed -n 's#.*url = "github:EveryInc/compound-engineering-plugin/\(.*\)";#\1#p' flake.nix)
          if [ -n "$resolved" ] && [ "$resolved" != "$current" ]; then
            case "$resolved" in
              "$TAG_PREFIX"v[0-9]*) ;;
              *) echo "refusing an unexpected resolved tag: $resolved" >&2; exit 1 ;;
            esac
            sed -i "s#compound-engineering-plugin/$current#compound-engineering-plugin/$resolved#" flake.nix
            sed -i "s#tag = \"$current\";#tag = \"$resolved\";#" home/h82/agents/agent-plugins.nix
            nix flake lock --update-input compound-engineering-plugin
            rev=$(jq -r '.nodes["compound-engineering-plugin"].locked.rev' flake.lock)
            case "$rev" in
              [0-9a-f][0-9a-f]*) ;;
              *) echo "flake.lock recorded no usable revision" >&2; exit 1 ;;
            esac
            sed -i "s#expectedRev = \"[0-9a-f]*\";#expectedRev = \"$rev\";#" home/h82/agents/agent-plugins.nix
          fi

          # 3. Update Claude Desktop
          nix run .#claude-desktop-release -- --output packages/claude-desktop-version.json

          # 4. Update Claude Code
          nix run .#claude-code-release -- --output packages/claude-code-manifest.json

          # 5. Update the Android SDK pin
          nix run .#android-sdk-release -- --output packages/android-sdk-repo.json

          # 6. Update mise
          nix run .#mise-release -- --output packages/mise-release.json

          # 7. Update T3 Code. A nightly can be published before its assets
          # and digests are, so a failure here keeps the current pin and lets
          # the other updates through.
          if ! nix run .#t3code-release -- --output packages/t3code-release.json; then
            echo "::warning title=T3 Code update skipped::t3code-release failed; keeping the current pin in packages/t3code-release.json."
            git checkout -- packages/t3code-release.json
          fi

          # 8. Update the Antigravity CLI. A feed failure keeps the current
          # pin and lets the other updates through, as T3 Code's does.
          if ! nix run .#antigravity-cli-release -- --output packages/antigravity-cli-release.json; then
            echo "::warning title=Antigravity CLI update skipped::antigravity-cli-release failed; keeping the current pin in packages/antigravity-cli-release.json."
            git checkout -- packages/antigravity-cli-release.json
          fi

          # 9. Update WiFiman Desktop. An API failure keeps the current pin
          # and lets the other updates through, as T3 Code's does.
          if ! nix run .#wifiman-desktop-release -- --output packages/wifiman-desktop-version.json; then
            echo "::warning title=WiFiman Desktop update skipped::wifiman-desktop-release failed; keeping the current pin in packages/wifiman-desktop-version.json."
            git checkout -- packages/wifiman-desktop-version.json
          fi

          # 10. Update OpenCode. The npm tag can move before every platform
          # package is published, so a failure keeps the current pin and lets
          # the other updates through, as T3 Code's does.
          if ! nix run .#opencode-release -- --output packages/opencode-release.json; then
            echo "::warning title=OpenCode update skipped::opencode-release failed; keeping the current pin in packages/opencode-release.json."
            git checkout -- packages/opencode-release.json
          fi

          # Refresh the Synthetic catalog snapshot Pi's model config renders
          # from. A catalog that lacks a model the source names, or an
          # unreachable one, keeps the current snapshot and lets the other
          # updates through; the model-watch issue reports the drift.
          if ! nix run .#synthetic-models-watch -- --snapshot home/h82/agents/synthetic-catalog.json; then
            echo "::warning title=Synthetic catalog snapshot skipped::synthetic-models-watch --snapshot failed; keeping the current home/h82/agents/synthetic-catalog.json."
            git checkout -- home/h82/agents/synthetic-catalog.json
          fi

          # 10b. Update Pi. A release can be published before every platform
          # tarball or its SHA256SUMS line, so a failure keeps the current pin
          # and lets the other updates through, as OpenCode's does.
          if ! nix run .#pi-release -- --output packages/pi-release.json; then
            echo "::warning title=Pi update skipped::pi-release failed; keeping the current pin in packages/pi-release.json."
            git checkout -- packages/pi-release.json
          fi

          # 10c. Update Pi's ACP adapter and client. Each pin moves with its
          # regenerated lock file, so a failure restores both and lets the
          # other updates through, as Pi's does.
          for npm_package in pi-acp acpx; do
            if ! nix run .#npm-release -- --package "$npm_package" \
              --output "packages/$npm_package-release.json" \
              --lock "packages/$npm_package/package-lock.json"; then
              echo "::warning title=$npm_package update skipped::npm-release failed; keeping the current pin in packages/$npm_package-release.json."
              git checkout -- "packages/$npm_package-release.json" "packages/$npm_package/package-lock.json"
            fi
          done

          # 11. Update the Antigravity ACP runtime on PATH. Google publishes
          # no pointer, so the helper probes candidate versions and downloads
          # only a newer complete release. A failure keeps the current pin and
          # lets the other updates through, as T3 Code's does.
          PRE_ACP_T3_ANTIGRAVITY=$(jq -c '.antigravity' packages/t3code-release.json)
          if ! nix run .#antigravity-acp-release -- --output packages/antigravity-acp-release.json; then
            echo "::warning title=Antigravity ACP runtime update skipped::antigravity-acp-release failed; keeping the current pin in packages/antigravity-acp-release.json."
            git checkout -- packages/antigravity-acp-release.json
            if [ "$PRE_ACP_T3_ANTIGRAVITY" = "null" ]; then
              jq --indent 2 'del(.antigravity)' packages/t3code-release.json > packages/t3code-release.json.tmp && mv packages/t3code-release.json.tmp packages/t3code-release.json
            else
              jq --indent 2 --argjson agy "$PRE_ACP_T3_ANTIGRAVITY" '.antigravity = $agy' packages/t3code-release.json > packages/t3code-release.json.tmp && mv packages/t3code-release.json.tmp packages/t3code-release.json
            fi
          fi

          if [ -z "$(git status --porcelain)" ]; then
            echo "No updates detected across all targets."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Updates detected."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify updates
        if: steps.update.outputs.changed == 'true'
        id: verify
        run: |
          set +e
          # The step runs without pipefail, so $? after a pipe is tee's
          # status; PIPESTATUS[0] is the command's own.
          nix fmt -- --ci 2>&1 | tee fmt.log
          FMT_EXIT=${PIPESTATUS[0]}
          nix flake check --print-build-logs 2>&1 | tee check.log
          CHECK_EXIT=${PIPESTATUS[0]}
          # The VM tests live outside `nix flake check`. Their own log keeps a
          # flake check failure from being pushed out of the tail below.
          nix build --no-link --print-build-logs .#vmChecks.all 2>&1 | tee vm-check.log
          VM_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$FMT_EXIT" -eq 0 ] && [ "$CHECK_EXIT" -eq 0 ] && [ "$VM_EXIT" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "All verification checks passed."
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "Verification failed (fmt: $FMT_EXIT, check: $CHECK_EXIT, vm checks: $VM_EXIT)."
            {
              echo "### Verification Failure Details"
              if [ "$CHECK_EXIT" -ne 0 ]; then
                echo "#### nix flake check"
                echo '```text'
                tail -n 50 check.log
                echo '```'
              fi
              if [ "$VM_EXIT" -ne 0 ]; then
                echo "#### NixOS VM tests"
                echo '```text'
                tail -n 50 vm-check.log
                echo '```'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Push verified updates directly to main
        if: steps.update.outputs.changed == 'true' && steps.verify.outputs.status == 'success'
        run: |
          set -euo pipefail

          if [ -n "$(git status --porcelain packages/claude-desktop-version.json)" ]; then
            NEW_VER=$(jq -r .version packages/claude-desktop-version.json)
            git add packages/claude-desktop-version.json
            git commit -m "chore(packages): bump claude-desktop to $NEW_VER"
          fi

          if [ -n "$(git status --porcelain packages/claude-code-manifest.json)" ]; then
            NEW_VER=$(jq -r .version packages/claude-code-manifest.json)
            git add packages/claude-code-manifest.json
            git commit -m "chore(packages): bump claude-code to $NEW_VER"
          fi

          if [ -n "$(git status --porcelain packages/opencode-release.json)" ]; then
            NEW_VER=$(jq -r .version packages/opencode-release.json)
            git add packages/opencode-release.json
            git commit -m "chore(packages): bump opencode to $NEW_VER"
          fi

          if [ -n "$(git status --porcelain home/h82/agents/synthetic-catalog.json)" ]; then
            git add home/h82/agents/synthetic-catalog.json
            git commit -m "chore(agents): refresh the synthetic catalog snapshot"
          fi

          if [ -n "$(git status --porcelain packages/pi-release.json)" ]; then
            NEW_VER=$(jq -r .version packages/pi-release.json)
            git add packages/pi-release.json
            git commit -m "chore(packages): bump pi to $NEW_VER"
          fi

          for npm_package in pi-acp acpx; do
            if [ -n "$(git status --porcelain "packages/$npm_package-release.json" "packages/$npm_package/package-lock.json")" ]; then
              NEW_VER=$(jq -r .version "packages/$npm_package-release.json")
              git add "packages/$npm_package-release.json" "packages/$npm_package/package-lock.json"
              git commit -m "chore(packages): bump $npm_package to $NEW_VER"
            fi
          done

          # The ACP updater writes the PATH pin and the antigravity section of
          # t3code-release.json as one identity. Commit those two files
          # together when both are dirty. A commit of the t3 file alone would
          # publish the new section beside the previous PATH pin, and the pin
          # check fails on that revision. Verify runs before these commits, so
          # it would stay green. A T3-only change, with the PATH pin clean,
          # stays its own commit. The PATH-only commit below still covers a
          # dirty PATH pin whose t3 file is clean.
          if [ -n "$(git status --porcelain packages/antigravity-acp-release.json)" ] &&
            [ -n "$(git status --porcelain packages/t3code-release.json)" ]; then
            NEW_VER=$(jq -r .version packages/antigravity-acp-release.json)
            T3_VER=$(jq -r .version packages/t3code-release.json)
            OLD_T3=$(git show HEAD:packages/t3code-release.json | jq -r .version)
            git add packages/antigravity-acp-release.json packages/t3code-release.json
            if [ "$T3_VER" != "$OLD_T3" ]; then
              git commit -m "chore(packages): bump antigravity-acp to $NEW_VER" \
                -m "Also bumps t3code to $T3_VER."
            else
              git commit -m "chore(packages): bump antigravity-acp to $NEW_VER"
            fi
          elif [ -n "$(git status --porcelain packages/t3code-release.json)" ]; then
            NEW_VER=$(jq -r .version packages/t3code-release.json)
            git add packages/t3code-release.json
            git commit -m "chore(packages): bump t3code to $NEW_VER"
          fi

          if [ -n "$(git status --porcelain packages/antigravity-cli-release.json)" ]; then
            NEW_VER=$(jq -r .version packages/antigravity-cli-release.json)
            git add packages/antigravity-cli-release.json
            git commit -m "chore(packages): bump antigravity-cli to $NEW_VER"
          fi

          if [ -n "$(git status --porcelain packages/antigravity-acp-release.json)" ]; then
            NEW_VER=$(jq -r .version packages/antigravity-acp-release.json)
            git add packages/antigravity-acp-release.json
            git commit -m "chore(packages): bump antigravity-acp to $NEW_VER"
          fi

          if [ -n "$(git status --porcelain packages/wifiman-desktop-version.json)" ]; then
            NEW_VER=$(jq -r .version packages/wifiman-desktop-version.json)
            git add packages/wifiman-desktop-version.json
            git commit -m "chore(packages): bump wifiman-desktop to $NEW_VER"
          fi

          if [ -n "$(git status --porcelain packages/mise-release.json)" ]; then
            NEW_VER=$(jq -r .version packages/mise-release.json)
            git add packages/mise-release.json
            git commit -m "chore(packages): bump mise to $NEW_VER"
          fi

          if [ -n "$(git status --porcelain packages/android-sdk-repo.json)" ]; then
            PINNED=$(jq -r '.latest | to_entries | map("\(.key) \(.value)") | join(", ")' packages/android-sdk-repo.json)
            git add packages/android-sdk-repo.json
            git commit -m "chore(packages): bump android sdk pin" -m "Pinned: $PINNED"
          fi

          if [ -n "$(git status --porcelain home/h82/agents/agent-plugins.nix)" ]; then
            NEW_TAG=$(sed -n 's/.*tag = "\(.*\)";/\1/p' home/h82/agents/agent-plugins.nix)
            git add flake.nix flake.lock home/h82/agents/agent-plugins.nix
            git commit -m "chore(agents): bump compound-engineering to $NEW_TAG"
          fi

          if [ -n "$(git status --porcelain flake.lock)" ]; then
            git add flake.lock
            git commit -m "chore(flake): update flake.lock"
          fi

          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(deps): update dependencies"
          fi

          # Rebase only after every change is committed: `git rebase` requires
          # a clean working tree even when origin/main has not moved at all,
          # so rebasing before committing fails unconditionally whenever this
          # step has anything to push.
          git fetch origin main
          git rebase origin/main || { git rebase --abort; echo "Rebase failed, proceeding with current head"; }

          git push origin main
          echo "Successfully pushed verified updates directly to main."

      - name: Open reconciliation PR on failure
        if: steps.update.outputs.changed == 'true' && steps.verify.outputs.status == 'failure'
        env:
          BRANCH: update-dependencies-fix
        run: |
          set -euo pipefail
          # An open PR's branch may carry fix commits from a person.
          # Resetting it to this run's update would discard them, so an open
          # PR only gets this run's logs. A failed query fails the step rather
          # than reading as "no open PR".
          open_prs=$(gh pr list --head "$BRANCH" --state open --json number --jq length)

          {
            echo "## Automated Dependency Update (Reconciliation Required)"
            echo ""
            echo "The dependency update job, which runs every 30 minutes, detected changes to flake inputs or packages, but pre-push verification failed."
            echo ""
            echo "### Failure Logs"
            echo "#### nix flake check"
            echo '```text'
            tail -n 80 check.log
            echo '```'
            echo "#### NixOS VM tests"
            echo '```text'
            tail -n 80 vm-check.log
            echo '```'
            echo ""
            if [ "$open_prs" -gt 0 ]; then
              echo "These logs are from the latest failing run, which left this branch as it was."
            fi
            echo "Push a fix to this branch; CI runs on each push. This PR waits for you to review and merge it."
          } > pr-body.md

          if [ "$open_prs" -gt 0 ]; then
            gh pr edit "$BRANCH" --body-file pr-body.md
          else
            TITLE="chore(deps): automated dependency update (reconciliation required)"
            git checkout -B "$BRANCH"
            git add -A
            git commit -m "$TITLE"
            git push --force-with-lease origin "$BRANCH"
            gh pr create --head "$BRANCH" --title "$TITLE" --body-file pr-body.md
          fi
